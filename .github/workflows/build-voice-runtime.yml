name: Build Voice Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-voice-runtime.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23
          actions-cache-folder: emsdk-cache

      - name: Checkout speech runtime source
        run: git clone --depth 1 --branch v1.13.4 https://github.com/k2-fsa/sherpa-onnx.git runtime-source

      - name: Download Kokoro model
        working-directory: runtime-source/wasm/tts/assets
        run: |
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_1.tar.bz2 \
            --output kokoro.tar.bz2
          tar --extract --bzip2 --strip-components 1 --file kokoro.tar.bz2
          unlink kokoro.tar.bz2

      - name: Configure single-thread WebAssembly
        working-directory: runtime-source
        run: |
          sed --in-place '/-pthread -sPTHREAD_POOL_SIZE=4/d' wasm/tts/CMakeLists.txt
          sed --in-place '/pthread-enabled/d' wasm/tts/CMakeLists.txt

      - name: Remove unsupported Kokoro lexicon tokens
        working-directory: runtime-source/wasm/tts/assets
        run: |
          sed --in-place '/^呣 ❓$/d' lexicon-zh.txt
          test "$(grep --count '❓' lexicon-zh.txt || true)" = "0"

      - name: Configure Kokoro WebAssembly defaults
        working-directory: runtime-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wasm/tts/sherpa-onnx-tts.js')
          source = path.read_text()
          source = source.replace('let modelType = 0;', 'let modelType = 7;')
          source = source.replace('debug: 1,', 'debug: 0,')
          marker = '  }\n\n  const offlineTtsModelConfig = {'
          kokoro_case = '''    case 7:
              // kokoro zh-en
              offlineTtsKokoroModelConfig.model = './model.int8.onnx';
              offlineTtsKokoroModelConfig.voices = './voices.bin';
              offlineTtsKokoroModelConfig.tokens = './tokens.txt';
              offlineTtsKokoroModelConfig.dataDir = './espeak-ng-data';
              offlineTtsKokoroModelConfig.lexicon =
                  './lexicon-us-en.txt,./lexicon-zh.txt';
              ruleFsts = './phone-zh.fst,./date-zh.fst,./number-zh.fst';
              break;
            }\n\n  const offlineTtsModelConfig = {'''
          if marker not in source:
              raise SystemExit('Unable to locate the TTS model switch.')
          path.write_text(source.replace(marker, kokoro_case, 1))
          PY

      - name: Build WebAssembly runtime
        working-directory: runtime-source
        run: ./build-wasm-simd-tts.sh

      - name: Collect runtime files
        run: |
          mkdir --parents voice-runtime
          cp runtime-source/build-wasm-simd-tts/install/bin/wasm/tts/sherpa-onnx-tts.js voice-runtime/
          cp runtime-source/build-wasm-simd-tts/install/bin/wasm/tts/sherpa-onnx-tts.worker.js voice-runtime/
          cp runtime-source/build-wasm-simd-tts/install/bin/wasm/tts/sherpa-onnx-wasm-main-tts.js voice-runtime/
          cp runtime-source/build-wasm-simd-tts/install/bin/wasm/tts/sherpa-onnx-wasm-main-tts.wasm voice-runtime/
          cp runtime-source/build-wasm-simd-tts/install/bin/wasm/tts/sherpa-onnx-wasm-main-tts.data voice-runtime/
          cp runtime-source/LICENSE voice-runtime/LICENSE.sherpa-onnx.txt
          cp runtime-source/wasm/tts/assets/LICENSE voice-runtime/LICENSE.kokoro.txt
          ls -lh voice-runtime

      - name: Publish voice runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view voice-runtime-v1 >/dev/null 2>&1 || \
            gh release create voice-runtime-v1 --title "Voice Runtime v1" --notes "Single-thread browser runtime for local Chinese speech synthesis."
          gh release upload voice-runtime-v1 voice-runtime/* --clobber
