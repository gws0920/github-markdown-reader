name: Quality and Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Verify registry
        run: test "$(npm config get registry)" = "https://registry.npmjs.org/"
      - name: Install
        run: npm ci --registry=https://registry.npmjs.org/
      - name: Quality checks
        run: npm run check
      - name: Add voice runtime
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir --parents dist/voice-runtime
          if gh release view voice-runtime-v1 >/dev/null 2>&1; then
            gh release download voice-runtime-v1 --dir dist/voice-runtime
            if [ ! -f dist/voice-runtime/voice-runtime-manifest.json ]; then
              python3 - <<'PY'
              import hashlib
              import json
              from pathlib import Path

              chunk_size = 4 * 1024 * 1024
              runtime_dir = Path('dist/voice-runtime')
              files = {}
              for path in sorted(runtime_dir.iterdir()):
                  if not path.is_file():
                      continue
                  digest = hashlib.sha256()
                  chunks = []
                  with path.open('rb') as source:
                      while True:
                          chunk = source.read(chunk_size)
                          if not chunk:
                              break
                          digest.update(chunk)
                          chunks.append(hashlib.sha256(chunk).hexdigest())
                  files[path.name] = {
                      'size': path.stat().st_size,
                      'sha256': digest.hexdigest(),
                      'chunkSize': chunk_size,
                      'chunks': chunks,
                  }
              manifest = {'version': 'voice-runtime-v2', 'files': files}
              (runtime_dir / 'voice-runtime-manifest.json').write_text(
                  json.dumps(manifest, ensure_ascii=False, separators=(',', ':'))
              )
              PY
            fi
          else
            echo "Voice runtime release is not available yet; browser speech fallback remains enabled."
          fi
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
