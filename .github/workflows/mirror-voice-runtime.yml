name: Mirror Voice Runtime

on:
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'voice-runtime-v1'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ vars.HF_REPO_ID || 'gws0920/github-markdown-reader-voice-runtime' }}
    steps:
      - name: Require mirror credentials
        run: test -n "$HF_TOKEN"
      - name: Download release assets
        run: |
          mkdir --parents voice-runtime
          gh release download voice-runtime-v1 \
            --repo "${{ github.repository }}" \
            --dir voice-runtime
      - name: Install public upload client
        run: python -m pip install --index-url https://pypi.org/simple huggingface_hub
      - name: Create public dataset repository
        run: hf repo create "$HF_REPO_ID" --repo-type dataset --exist-ok
      - name: Upload runtime to public CDN
        run: hf upload "$HF_REPO_ID" voice-runtime . --repo-type dataset
